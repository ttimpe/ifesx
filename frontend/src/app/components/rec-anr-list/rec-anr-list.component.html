<div class="flex flex-col h-full bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden">
    <!-- Header Toolbar -->
    <div class="flex items-center justify-between p-4 border-b border-slate-100 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-900/50">
        <div class="flex items-center gap-3">
            <div class="p-2 bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 rounded-lg">
                <fa-icon [icon]="faVolumeHigh" class="text-xl"></fa-icon>
            </div>
            <div>
                <h2 class="text-lg font-bold text-slate-800 dark:text-slate-100 tracking-tight">Ansagen</h2>
                <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">{{rows.length}} Einträge gefunden</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <div class="relative flex items-center">
                <i class="pi pi-search absolute left-3 text-slate-400 z-10 pointer-events-none"></i>
                <input type="text" pInputText placeholder="Suchen..." (input)="applyFilterGlobal($event, 'contains')"
                    class="!pl-10 !pr-4 !py-2 !border !border-slate-300 dark:border-slate-600 !rounded-lg !text-sm !w-64 focus:!border-indigo-500 focus:!ring-2 focus:!ring-indigo-100 !bg-white dark:!bg-slate-800 transition-all shadow-sm" />
            </div>
            <p-button label="Neue Ansage" icon="pi pi-plus" routerLink="/rec-anr/new" severity="success" size="small"></p-button>
        </div>
    </div>

    <!-- Table -->
    <div class="flex-1 overflow-auto bg-white dark:bg-slate-800 p-2">
    <p-table #dt [value]="rows" [rows]="100" [paginator]="true" [globalFilterFields]="['ANR_NR', 'ANR_TEXT']"
        [tableStyle]="{ 'min-width': '50rem' }" [rowHover]="true" styleClass="p-datatable-striped">

        <ng-template pTemplate="header">
            <tr>
                <th pSortableColumn="ANR_NR" class="font-semibold text-sm text-slate-700 dark:text-slate-200" style="width:20%">Nr
                    <p-sortIcon field="ANR_NR"></p-sortIcon>
                </th>
                <th pSortableColumn="ANR_TEXT" class="font-semibold text-sm text-slate-700 dark:text-slate-200" style="width:60%">Text
                    <p-sortIcon field="ANR_TEXT"></p-sortIcon>
                </th>
                <th class="font-semibold text-sm text-slate-700 dark:text-slate-200" style="width:20%">Aktionen</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-row>
            <tr class="hover:bg-slate-50 dark:bg-slate-900 transition-colors">
                <td class="font-medium text-slate-600 dark:text-slate-300">
                    <a [routerLink]="['/rec-anr', row.ANR_NR]" class="font-bold text-blue-600 dark:text-blue-400 dark:text-blue-400 hover:underline">{{ row.ANR_NR }}</a>
                </td>
                <td>{{ row.ANR_TEXT }}</td>
                <td>
                    <div class="flex gap-1">
                        <p-button icon="pi pi-pencil" [text]="true" severity="secondary" size="small"
                            [routerLink]="['/rec-anr', row.ANR_NR]" pTooltip="Bearbeiten"></p-button>
                        <p-button icon="pi pi-trash" [text]="true" severity="danger" size="small"
                            (onClick)="deleteRow(row)" pTooltip="Löschen"></p-button>
                    </div>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="3" class="text-center p-8 text-slate-500 dark:text-slate-400">
                    <div class="flex flex-col items-center justify-center">
                        <i class="pi pi-megaphone text-4xl mb-3 text-slate-300"></i>
                        <p>Keine Ansagen gefunden.</p>
                    </div>
                </td>
            </tr>
        </ng-template>
    </p-table>
    </div>
</div>
