<div class="flex flex-col h-full bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden"
    *ngIf="vehicle">
    <!-- Header -->
    <div
        class="flex items-center justify-between p-4 border-b border-slate-100 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-900/50 dark:bg-slate-900/50">
        <div class="flex items-center gap-4">
            <a routerLink="/vehicles">
                <p-button icon="pi pi-arrow-left" [text]="true" severity="secondary"></p-button>
            </a>
            <div class="p-2 bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 rounded-lg">
                <fa-icon [icon]="faBus" class="text-xl"></fa-icon>
            </div>
            <div>
                <h2 class="text-lg font-bold text-slate-800 dark:text-slate-100">Fahrzeug: {{ vehicle.FZG_TEXT ||
                    vehicle.FZG_NR }}</h2>
                <p class="text-xs text-slate-500 dark:text-slate-400">FZG_NR: {{ vehicle.FZG_NR }}</p>
            </div>
        </div>
        <div class="flex gap-2">
            <p-button label="Speichern" icon="pi pi-save" severity="success" (onClick)="save()"></p-button>
            <p-button label="Löschen" icon="pi pi-trash" severity="danger" [outlined]="true"
                (onClick)="delete()"></p-button>
        </div>
    </div>

    <!-- Content -->
    <div class="flex-1 overflow-auto bg-slate-50 dark:bg-slate-900 p-4">
        <div class="max-w-3xl mx-auto">
            <p-card styleClass="shadow-sm border border-slate-200 dark:border-slate-700 rounded-xl">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="flex flex-col gap-2">
                        <label class="text-sm font-medium text-slate-700 dark:text-slate-200">Fahrzeug Nummer
                            (FZG_NR)</label>
                        <input pInputText [(ngModel)]="vehicle.FZG_NR" [disabled]="true" class="w-full" />
                        <small class="text-slate-400">Kann nicht geändert werden</small>
                    </div>

                    <div class="flex flex-col gap-2">
                        <label class="text-sm font-medium text-slate-700 dark:text-slate-200">Bezeichnung /
                            Kennzeichen</label>
                        <input pInputText [(ngModel)]="vehicle.FZG_TEXT" placeholder="z.B. BI-NV 101" class="w-full" />
                    </div>

                    <div class="flex flex-col gap-2">
                        <label class="text-sm font-medium text-slate-700 dark:text-slate-200">Fahrzeugtyp</label>
                        <p-select [options]="types" [(ngModel)]="vehicle.FZG_TYP_NR" optionLabel="FZG_TYP_TEXT"
                            optionValue="FZG_TYP_NR" placeholder="Typ wählen..." styleClass="w-full"
                            appendTo="body"></p-select>
                    </div>

                    <div class="flex flex-col gap-2">
                        <label class="text-sm font-medium text-slate-700 dark:text-slate-200">Unternehmen</label>
                        <p-inputNumber [(ngModel)]="vehicle.UNTERNEHMEN" [useGrouping]="false"
                            styleClass="w-full"></p-inputNumber>
                    </div>
                </div>
            </p-card>
        </div>
    </div>
</div>

<p-confirmDialog></p-confirmDialog>
