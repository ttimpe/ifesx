<div
    class="flex flex-col h-full bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden">

    <!-- Header -->
    <div
        class="flex items-center justify-between p-4 border-b border-slate-100 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-900/50">
        <div class="flex items-center gap-3">
            <div class="p-2 bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 rounded-lg">
                <fa-icon [icon]="faVolumeHigh" class="text-xl"></fa-icon>
            </div>
            <div>
                <h2 class="text-lg font-bold text-slate-800 dark:text-slate-100 tracking-tight">
                    {{ isNew ? 'Neuer Ansage-Text' : 'Ansage-Text bearbeiten' }}
                </h2>
            </div>
        </div>
        <div class="flex gap-2">
            <p-button *ngIf="!isNew" label="Löschen" icon="pi pi-trash" severity="danger" [outlined]="true"
                (onClick)="delete()"></p-button>
            <p-button label="Speichern" icon="pi pi-check" severity="success" (onClick)="save()"></p-button>
        </div>
    </div>

    <div class="flex-1 overflow-auto bg-slate-50 dark:bg-slate-900 p-4">
        <div class="max-w-2xl mx-auto flex flex-col gap-6">

            <p-card styleClass="shadow-sm border border-slate-200 dark:border-slate-700 rounded-xl overflow-hidden">
                <div class="flex flex-col gap-6">

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="flex flex-col gap-2">
                            <label for="anrNr" class="text-sm font-medium text-slate-700 dark:text-slate-200">Nummer
                                (ANR_NR)</label>
                            <input pInputText id="anrNr" type="number" [(ngModel)]="item.ANR_NR" class="w-full"
                                placeholder="z.B. 101" />
                            <small class="text-slate-500 dark:text-slate-400">Eindeutige ID für diesen Text.</small>
                        </div>

                        <div class="flex flex-col gap-2">
                            <label for="anrKurzel" class="text-sm font-medium text-slate-700 dark:text-slate-200">Kürzel
                                (ANR_KURZEL)</label>
                            <input pInputText id="anrKurzel" [(ngModel)]="item.ANR_KURZEL" class="w-full" maxlength="10"
                                placeholder="z.B. HBF" />
                            <small class="text-slate-500 dark:text-slate-400">Kurzkennzeichen (max. 10 Zeichen).</small>
                        </div>
                    </div>

                    <div class="flex flex-col gap-2">
                        <label for="anrText" class="text-sm font-medium text-slate-700 dark:text-slate-200">Ansage-Text
                            / Display-Text</label>
                        <textarea pInputTextarea id="anrText" [(ngModel)]="item.ANR_TEXT" rows="3" class="w-full"
                            maxlength="200" placeholder="z.B. Nächster Halt: Hauptbahnhof"></textarea>
                        <small class="text-slate-500 dark:text-slate-400">Maximal 200 Zeichen.</small>
                    </div>

                    <!-- Audio File -->
                    <div class="flex flex-col gap-2 border-t border-slate-100 dark:border-slate-700 pt-4">
                        <label class="text-sm font-medium text-slate-700 dark:text-slate-200">Audio-Datei
                            (ANR_DATEI)</label>
                        <div class="flex items-center gap-3">
                            <span *ngIf="item.ANR_DATEI"
                                class="text-sm text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 px-3 py-1.5 rounded-lg flex items-center gap-2">
                                <i class="pi pi-volume-up text-indigo-500"></i>
                                {{ item.ANR_DATEI }}
                            </span>
                            <span *ngIf="!item.ANR_DATEI" class="text-sm text-slate-400">Keine Datei verknüpft</span>
                        </div>
                        <div class="flex items-center gap-3 mt-1">
                            <input #fileInput type="file" accept="audio/*" class="hidden"
                                (change)="onFileSelected($event)" />
                            <p-button label="Datei hochladen" icon="pi pi-upload" severity="secondary" size="small"
                                (onClick)="fileInput.click()" [loading]="isUploading"></p-button>
                            <p-button *ngIf="item.ANR_DATEI" icon="pi pi-times" severity="danger" [text]="true"
                                size="small" pTooltip="Datei löschen" (onClick)="removeFile()"></p-button>
                        </div>
                        <small class="text-slate-500 dark:text-slate-400">Audio-Datei für die Ansage (z.B. MP3,
                            WAV).</small>
                    </div>

                </div>
            </p-card>

        </div>
    </div>
</div>
