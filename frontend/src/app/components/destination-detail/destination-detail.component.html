<div class="container mx-auto p-4 max-w-5xl animate-fade-in">
  <div class="flex flex-col h-full bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden"
    *ngIf="destination">
    <!-- Header Toolbar -->
    <div class="flex items-center justify-between p-4 border-b border-slate-100 bg-slate-50/50">
      <div class="flex items-center gap-4">
        <div class="w-10 h-10 bg-emerald-100 text-emerald-600 rounded-lg flex items-center justify-center">
          <i class="pi pi-flag text-xl"></i>
        </div>
        <div>
          <h2 class="text-lg font-bold text-slate-800 tracking-tight">
            {{ destination.ZNR_NR ? 'Ziel bearbeiten' : 'Neues Ziel' }}
          </h2>
          <p *ngIf="destination.ZNR_TEXT" class="text-xs text-slate-500 font-medium">{{ destination.ZNR_TEXT }}</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <p-button label="Speichern" icon="pi pi-check" severity="success" size="small"
          (onClick)="saveDestination()"></p-button>
        <p-button label="Zurück" icon="pi pi-arrow-left" routerLink="/destinations" severity="secondary" size="small"
          [text]="true"></p-button>
      </div>
    </div>

    <!-- Content -->
    <div class="flex-1 overflow-auto p-6">
      <p-toast></p-toast>

      <div class="flex flex-col gap-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="flex flex-col gap-2">
            <label class="font-bold text-slate-700">Zielnummer (ZNR_NR)</label>
            <p-inputNumber [(ngModel)]="destination.ZNR_NR" [useGrouping]="false" styleClass="w-full"
              class="w-full"></p-inputNumber>
            <small class="text-slate-500">Eindeutige ID des Ziels</small>
          </div>
          <div class="flex flex-col gap-2">
            <label class="font-bold text-slate-700">Zieltext (ZNR_TEXT)</label>
            <input pInputText [(ngModel)]="destination.ZNR_TEXT" class="w-full" maxlength="160" />
          </div>
        </div>

        <div class="flex flex-col gap-2">
          <label class="font-bold text-slate-700">Kürzel (ZNR_KUERZEL)</label>
          <input pInputText [(ngModel)]="destination.ZNR_KUERZEL" class="w-full" maxlength="10" />
        </div>

        <div class="flex flex-col gap-2">
          <label class="font-bold text-slate-700">Fahrerkurztext</label>
          <input pInputText [(ngModel)]="destination.FAHRERKURZTEXT" class="w-full" maxlength="44" />
          <small class="text-slate-500">Für das Fahrerdisplay</small>
        </div>

        <div class="flex flex-col gap-4 p-4 bg-slate-50 rounded-lg border border-slate-100">
          <label class="font-bold text-slate-700 flex items-center gap-2">
            <i class="pi pi-desktop text-slate-400"></i>
            Seitentext (SEITENTEXT)
          </label>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="flex flex-col gap-1.5">
              <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Takt 1 - Zeile 1</span>
              <input pInputText [(ngModel)]="seitenTextLines[0]" class="w-full" maxlength="40"
                placeholder="Erste Zeile, Erster Takt" />
            </div>
            <div class="flex flex-col gap-1.5">
              <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Takt 2 - Zeile 1</span>
              <input pInputText [(ngModel)]="seitenTextLines[2]" class="w-full" maxlength="40"
                placeholder="Erste Zeile, Zweiter Takt" />
            </div>
            <div class="flex flex-col gap-1.5">
              <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Takt 1 - Zeile 2</span>
              <input pInputText [(ngModel)]="seitenTextLines[1]" class="w-full" maxlength="40"
                placeholder="Zweite Zeile, Erster Takt" />
            </div>
            <div class="flex flex-col gap-1.5">
              <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Takt 2 - Zeile 2</span>
              <input pInputText [(ngModel)]="seitenTextLines[3]" class="w-full" maxlength="40"
                placeholder="Zweite Zeile, Zweiter Takt" />
            </div>
          </div>
          <small class="text-slate-500 italic mt-1">Geben Sie bis zu 40 Zeichen pro Zeile ein. Takt 1 und 2 werden
            abwechselnd angezeigt.</small>
        </div>

        <div class="flex flex-col gap-2 md:col-span-2">
          <label class="font-bold text-slate-700">Steuercode (ZNR_CODE)</label>
          <input pInputText [(ngModel)]="destination.ZNR_CODE" class="w-full" maxlength="68" />
        </div>
      </div>
    </div>
  </div>
</div>
