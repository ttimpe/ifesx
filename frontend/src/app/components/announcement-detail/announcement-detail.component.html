<div class="container mx-auto p-4 max-w-5xl animate-fade-in">
  <div class="flex flex-col h-full bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden">
    <!-- Header Toolbar -->
    <div class="flex items-center justify-between p-4 border-b border-slate-100 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-900/50">
        <div class="flex items-center gap-3">
            <div class="p-2 bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 rounded-lg">
                <fa-icon [icon]="faBullhorn" class="text-xl"></fa-icon>
            </div>
        <div>
          <h2 class="text-lg font-bold text-slate-800 dark:text-slate-100 tracking-tight">
            {{ isNew ? 'Neue Ansage' : 'Ansage bearbeiten' }}
          </h2>
          <p *ngIf="anr.ANR_TEXT" class="text-xs text-slate-500 dark:text-slate-400 font-medium">{{ anr.ANR_TEXT }}</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <p-button label="Speichern" icon="pi pi-check" severity="success" size="small" (onClick)="save()"></p-button>
        <p-button *ngIf="!isNew" label="Löschen" icon="pi pi-trash" severity="danger" size="small" [text]="true"
          (onClick)="delete()"></p-button>
        <p-button label="Zurück" icon="pi pi-arrow-left" routerLink="/announcements" severity="secondary" size="small"
          [text]="true"></p-button>
      </div>
    </div>

    <!-- Content -->
    <div class="flex-1 overflow-auto p-6">
      <p-toast></p-toast>

      <div class="flex flex-col gap-6">

        <!-- Basis-Felder -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="flex flex-col gap-2">
            <label class="font-bold text-slate-700 dark:text-slate-200">ANR_NR <span
                class="text-slate-400 font-normal text-xs">(Nummer)</span></label>
            <p-inputNumber [(ngModel)]="anr.ANR_NR" [useGrouping]="false" styleClass="w-full" class="w-full"
              [disabled]="!isNew"></p-inputNumber>
          </div>
          <div class="flex flex-col gap-2">
            <label class="font-bold text-slate-700 dark:text-slate-200">BASIS_VERSION</label>
            <p-inputNumber [(ngModel)]="anr.BASIS_VERSION" [useGrouping]="false" styleClass="w-full" class="w-full"
              [disabled]="!isNew"></p-inputNumber>
          </div>
        </div>

        <div class="flex flex-col gap-2">
          <label class="font-bold text-slate-700 dark:text-slate-200">ANR_KURZEL <span class="text-slate-400 font-normal text-xs">(Kürzel,
              max. 10 Zeichen)</span></label>
          <input pInputText [(ngModel)]="anr.ANR_KURZEL" class="w-full font-mono" maxlength="10" />
        </div>

        <div class="flex flex-col gap-2">
          <label class="font-bold text-slate-700 dark:text-slate-200">ANR_TEXT <span
              class="text-slate-400 font-normal text-xs">(Ansagetext)</span></label>
          <input pInputText [(ngModel)]="anr.ANR_TEXT" class="w-full" />
        </div>

        <!-- Audiodatei -->
        <div class="flex flex-col gap-4 border p-4 rounded-lg bg-slate-50 dark:bg-slate-900 border-slate-200 dark:border-slate-700">
          <label class="font-bold text-slate-700 dark:text-slate-200">ANR_DATEI <span
              class="text-slate-400 font-normal text-xs">(Audiodatei)</span></label>

          <div class="flex gap-4 items-end flex-wrap">
            <div class="flex-1 flex flex-col gap-2" style="min-width: 200px">
              <label class="text-sm text-slate-500 dark:text-slate-400">Vorhandene Datei auswählen</label>
              <p-select [options]="fileNames" [(ngModel)]="anr.ANR_DATEI" placeholder="Datei wählen" [filter]="true"
                styleClass="w-full" [style]="{'width':'100%'}"></p-select>
            </div>
            <div class="flex-none pb-2">
              <span class="text-slate-400">ODER</span>
            </div>
            <div class="flex-1 flex flex-col gap-2" style="min-width: 200px">
              <label class="text-sm text-slate-500 dark:text-slate-400">Neue Datei hochladen</label>
              <p-fileUpload mode="basic" chooseLabel="Hochladen" name="file" accept="audio/*" [customUpload]="true"
                (uploadHandler)="onUploadHandler($event)" [auto]="true"></p-fileUpload>
              <span *ngIf="uploadInProgress" class="text-xs text-slate-400">Wird hochgeladen…</span>
            </div>
          </div>

          <div *ngIf="anr.ANR_DATEI"
            class="flex items-center gap-2 text-sm text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2">
            <i class="pi pi-file-audio text-pink-500"></i>
            <span class="flex-1">{{ anr.ANR_DATEI }}</span>
            <p-button icon="pi pi-times" [rounded]="true" [text]="true" severity="danger" size="small"
              (onClick)="anr.ANR_DATEI = undefined"></p-button>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
