<!-- stop-list.component.html -->
<div class="flex flex-col h-full bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
  <!-- Header Toolbar -->
  <div class="flex items-center justify-between p-4 border-b border-slate-100 bg-slate-50/50">
    <div class="flex items-center gap-4">
      <div class="w-10 h-10 bg-blue-100 text-blue-600 rounded-lg flex items-center justify-center">
        <fa-icon [icon]="faCircleH" class="text-xl"></fa-icon>
      </div>
      <div>
        <h2 class="text-lg font-bold text-slate-800 tracking-tight">Haltestellen</h2>
        <p class="text-xs text-slate-500 font-medium">{{nodes.length}} Gruppen / {{nodes.reduce(countStops, 0)}}
          Haltestellen</p>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <div class="relative flex items-center">
        <i class="pi pi-search absolute left-3 text-slate-400 z-10 pointer-events-none"></i>
        <input type="text" pInputText placeholder="Suchen..." (input)="applyFilterGlobal($event)"
          class="!pl-10 !pr-4 !py-2 !border !border-slate-300 !rounded-lg !text-sm !w-64 focus:!border-blue-500 focus:!ring-2 focus:!ring-blue-100 !bg-white transition-all shadow-sm" />
      </div>
      <p-button label="Neu" icon="pi pi-plus" severity="success" (onClick)="addStop()" size="small"></p-button>
    </div>
  </div>

  <!-- Table -->
  <div class="flex-1 overflow-auto bg-white p-2">
    <p-treeTable #tt [value]="nodes" [columns]="['name', 'nr', 'code']" [paginator]="true" [rows]="100"
      [globalFilterFields]="['name', 'nr', 'code']" [styleClass]="'p-treetable-sm'"
      currentPageReportTemplate="Zeige {first} bis {last} von {totalRecords} Einträgen" [showCurrentPageReport]="true">

      <ng-template pTemplate="header">
        <tr>
          <th style="width: 35%">Name</th>
          <th style="width: 10%">Typ</th>
          <th style="width: 15%">Nr. / ID</th>
          <th style="width: 15%">Kürzel</th>
          <th style="width: 25%">Aktionen</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-rowNode let-rowData="rowData">
        <tr [ttRow]="rowNode" [class.bg-slate-50]="rowData.type === 'group'"
          class="hover:bg-slate-100 transition-colors">
          <td class="flex items-center gap-2">
            <p-treeTableToggler [rowNode]="rowNode"></p-treeTableToggler>

            <ng-container *ngIf="rowData.type === 'group'">
              <fa-icon [icon]="faFolder" class="text-yellow-500 mr-2"></fa-icon>
              <span class="font-bold text-slate-700">{{ rowData.name }}</span>
              <span class="ml-2 text-xs bg-slate-200 text-slate-600 px-1.5 rounded-full">{{ rowData.count }}</span>
            </ng-container>

            <ng-container *ngIf="rowData.type === 'stop'">
              <fa-icon [icon]="faMapMarkerAlt" class="text-blue-500 mr-2"></fa-icon>
              <span class="text-slate-700 font-medium cursor-pointer hover:underline" (click)="editStop(rowData)">
                {{ rowData.name }}
              </span>
            </ng-container>
          </td>

          <td>
            <span *ngIf="rowData.type === 'stop'" class="px-2 py-0.5 rounded text-xs font-medium border"
              [class.bg-blue-50]="rowData.onrTyp === 1" [class.text-blue-700]="rowData.onrTyp === 1"
              [class.border-blue-200]="rowData.onrTyp === 1" [class.bg-slate-100]="rowData.onrTyp !== 1"
              [class.text-slate-600]="rowData.onrTyp !== 1" [class.border-slate-200]="rowData.onrTyp !== 1">
              {{ getOnrTypeLabel(rowData.onrTyp) }}
            </span>
          </td>

          <td class="font-mono text-xs text-slate-500">{{ rowData.nr }}</td>

          <td>
            <span *ngIf="rowData.code"
              class="px-2 py-0.5 bg-slate-100 text-slate-600 rounded text-xs font-mono border border-slate-200">
              {{ rowData.code }}
            </span>
          </td>

          <td>
            <div class="flex gap-2">
              <!-- Edit Button - now for both groups and stops -->
              <button pButton icon="pi pi-pencil" class="p-button-text p-button-warning p-button-sm"
                (click)="editStop(rowNode)">
              </button>

              <!-- Delete Button - only for stops -->
              <button *ngIf="rowData.type === 'stop'" pButton icon="pi pi-trash"
                class="p-button-text p-button-danger p-button-sm" (click)="deleteStop(rowNode)">
              </button>
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="4" class="text-center p-8 text-slate-500">
            Keine Haltestellen gefunden.
          </td>
        </tr>
      </ng-template>

    </p-treeTable>
  </div>
</div>
